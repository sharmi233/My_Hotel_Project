<!DOCTYPE html>
<html>
<head>
    <title>Welcome to Maldives</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0;
            font-family: sans-serif; 
            overflow: hidden;
        }

        .hero-image {
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), 
            url("https://images.unsplash.com/photo-1514282401047-d79a71a590e8?w=1600");
            
            height: 100vh;
            width: 100%;
            background-position: center; 
            background-repeat: no-repeat; 
            background-size: cover;
            
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: white; 
            flex-direction: column;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        nav { 
            background: rgba(0, 128, 128, 0.8); 
            padding: 15px 20px; 
            position: absolute;
            width: 100%;
            top: 0; 
            display: flex; 
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px; 
            z-index: 1000;
            box-sizing: border-box;
        }

        nav a { color: white; text-decoration: none; font-weight: bold; font-size: 14px; }
        
        .btn-rooms { 
            background: #ff4500; 
            color: white; 
            padding: 15px 30px; 
            text-decoration: none; 
            border-radius: 50px; 
            font-size: 20px; 
            font-weight: bold; 
            margin-top: 20px;
        }

        h1 { font-size: 60px; margin: 0; }
        p { font-size: 24px; }

        @media (max-width: 768px) {
            h1 { font-size: 36px; }
            p { font-size: 16px; }
            .btn-rooms { font-size: 16px; padding: 12px 24px; }
            nav { gap: 15px; }
        }

        @media (max-width: 480px) {
            h1 { font-size: 26px; }
            p { font-size: 14px; }
            .btn-rooms { font-size: 14px; padding: 10px 20px; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="/">HOME</a>
        <a href="/rooms/">ROOMS</a>
        <a href="/admin/">STAFF LOGIN</a>
    </nav>

    <div class="hero-image">
        <h1>Maldives Luxury Resort</h1>
        <p>Escape to Paradise with our exclusive water villas.</p>
        <a href="/rooms/" class="btn-rooms">Explore Rooms</a>
    </div>
</body>
</html>
